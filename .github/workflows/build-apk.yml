
name: Build AppLock APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q AppLockMinimal-AndroidStudio.zip
          test -f AppLockMinimal/settings.gradle.kts

      - name: Align Java and Kotlin targets
        run: |
          python3 - <<'PY'
          from pathlib import Path

          root = Path("AppLockMinimal")

          for p in root.rglob("*"):
              if not p.is_file():
                  continue
              if p.suffix not in (".gradle", ".kts"):
                  continue

              s = p.read_text()
              original = s

              # Align Java compilation with Kotlin JVM 17.
              s = s.replace(
                  "JavaVersion.VERSION_1_8",
                  "JavaVersion.VERSION_17"
              )
              s = s.replace(
                  "JavaVersion.VERSION_11",
                  "JavaVersion.VERSION_17"
              )

              # Support common Kotlin DSL/Groovy target syntax.
              s = s.replace(
                  'jvmTarget = "1.8"',
                  'jvmTarget = "17"'
              )
              s = s.replace(
                  "jvmTarget = '1.8'",
                  "jvmTarget = '17'"
              )
              s = s.replace(
                  "JvmTarget.JVM_1_8",
                  "JvmTarget.JVM_17"
              )

              if s != original:
                  p.write_text(s)
                  print(f"Updated {p}")

          PY

      - name: Build debug APK
        run: gradle -p AppLockMinimal --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-APK
          path: AppLockMinimal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
