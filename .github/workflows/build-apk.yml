
name: Build AppLock APK

'on':
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Extract Android project
        run: |
          unzip -q AppLockMinimal-AndroidStudio.zip
          test -f AppLockMinimal/settings.gradle.kts

      - name: Create JVM alignment script
        run: |
          cat > /tmp/align-jvm-targets.gradle <<'GRADLE'
          allprojects {
              tasks.withType(org.gradle.api.tasks.compile.JavaCompile).configureEach {
                  sourceCompatibility = '17'
                  targetCompatibility = '17'
              }

              plugins.withId('org.jetbrains.kotlin.android') {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions.jvmTarget = '17'
                  }
              }

              plugins.withId('org.jetbrains.kotlin.jvm') {
                  tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {
                      kotlinOptions.jvmTarget = '17'
                  }
              }
          }
          GRADLE

      - name: Build debug APK
        run: |
          gradle -p AppLockMinimal \
            --no-daemon \
            -I /tmp/align-jvm-targets.gradle \
            assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-APK
          path: AppLockMinimal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
          
