
name: Build AppLock APK

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Extract project
        run: |
          unzip -q AppLockMinimal-AndroidStudio.zip
          test -f AppLockMinimal/settings.gradle.kts

      - name: Build APK
        run: gradle -p AppLockMinimal --no-daemon assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AppLock-debug-APK
          path: AppLockMinimal/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

